<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privnote Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="logo">
      <h1>priv<span class="lock">&#x1F512;</span>ote</h1>
    </div>
    <p class="tagline">Send notes that will self-destruct after being read.</p>
  </header>
  <main>
    <div class="note-container">
      <h2>New note</h2>
      <textarea id="note-content" placeholder="Write your note here..."></textarea>
      <div class="button-container">
        <button id="create-note">Create note</button>
        <button id="show-options">Show options</button>
      </div>
    </div>
    <div id="link-container" style="display: none;">
      <p>Your private note link:</p>
      <input type="text" id="note-link" readonly>
      <p>This link will only work once. After viewing, the note will be destroyed.</p>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
